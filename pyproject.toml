[project]
name = "ksco_qa"
version = "0.1.0"
description = "KSCO Task QA 파이프라인 (P0→G0→G1→G2→G3) — 고정 코드 + LLM API 배치"
requires-python = ">=3.11"
dependencies = [
    "openai",
    "pydantic>=2",
    "jsonschema",
    "tenacity",
    "typer",
    "rich",
    "pyyaml",
    "openpyxl",
    "xlrd",
    "odfpy",
    "charset-normalizer",
    "lxml",
    "python-docx",
    "python-pptx",
    "scikit-learn",
    "networkx",
    "pdfplumber>=0.11.10",
]

[project.scripts]
ksco-qa = "ksco_qa.cli:app"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ksco_qa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
